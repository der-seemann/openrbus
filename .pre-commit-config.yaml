repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: publication-audit
        name: publication audit
        entry: python tools/check_publication.py
        language: system
        pass_filenames: false

